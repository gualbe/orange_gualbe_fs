', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#98A0A9" text-anchor="start" dominant-baseline="central">se descartan</text><text x="44" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">Cómo decide cuántos conservar</text><rect x="44" y="338" width="164" height="154" rx="10" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><text x="58" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F5F9E" text-anchor="start" dominant-baseline="central">K mejores</text><text x="58" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">SelectKBest</text><rect x="58" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="78" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="98" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="118" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><rect x="138" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><rect x="158" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><rect x="178" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><text x="58" y="428.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">los k de mayor</text><text x="58" y="446.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">puntuación</text><text x="58" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F5F9E" text-anchor="start" dominant-baseline="central">k = 3  →  3 atributos</text><rect x="218" y="338" width="164" height="154" rx="10" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><text x="232" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F5F9E" text-anchor="start" dominant-baseline="central">Percentil</text><text x="232" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">SelectPercentile</text><rect x="232" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="252" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="272" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="292" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="312" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><rect x="332" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><rect x="352" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><text x="232" y="428.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">el % de mejor</text><text x="232" y="446.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">puntuación</text><text x="232" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F5F9E" text-anchor="start" dominant-baseline="central">60 %  →  4 atributos</text><rect x="392" y="338" width="164" height="154" rx="10" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><text x="406" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F5F9E" text-anchor="start" dominant-baseline="central">Alpha</text><text x="406" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">Fpr · Fdr · Fwe</text><rect x="406" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="426" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="446" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="466" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="486" y="392" width="16" height="16" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><rect x="506" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><rect x="526" y="392" width="16" height="16" rx="3" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.2"/><text x="406" y="428.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">los de p-valor menor</text><text x="406" y="446.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">que α</text><text x="406" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F5F9E" text-anchor="start" dominant-baseline="central">α = 0,05  →  5 atributos</text><text x="44" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">Fpr, Fdr y Fwe controlan el error con distinto rigor (de menos a más estricto).</text><text x="624" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">2 · La función de puntuación</text><text x="624" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">depende del tipo de objetivo</text><text x="800" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606A" text-anchor="middle" dominant-baseline="central">Objetivo</text><text x="800" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#24292F" text-anchor="middle" dominant-baseline="central">categórico</text><text x="888" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606A" text-anchor="middle" dominant-baseline="central">Objetivo</text><text x="888" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#24292F" text-anchor="middle" dominant-baseline="central">numérico</text><text x="800" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A0A7AF" text-anchor="middle" dominant-baseline="central">(clasificación)</text><text x="888" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A0A7AF" text-anchor="middle" dominant-baseline="central">(regresión)</text><rect x="612" y="160" width="316" height="50" rx="8" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><text x="626" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">chi2</text><text x="626" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">atributos ≥ 0</text><circle cx="800" cy="186" r="14" fill="#CFEFDB" stroke="#1E7A4A" stroke-width="1.5"/><path d="M794 186 l4 4 l8 -9" fill="none" stroke="#1E7A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="888" cy="186" r="14" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.5"/><path d="M883 181 l10 10 M893 181 l-10 10" stroke="#98A0A9" stroke-width="2.2" stroke-linecap="round"/><rect x="612" y="216" width="316" height="50" rx="8" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><text x="626" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">f_classif</text><text x="626" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">ANOVA F</text><circle cx="800" cy="242" r="14" fill="#CFEFDB" stroke="#1E7A4A" stroke-width="1.5"/><path d="M794 242 l4 4 l8 -9" fill="none" stroke="#1E7A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="888" cy="242" r="14" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.5"/><path d="M883 237 l10 10 M893 237 l-10 10" stroke="#98A0A9" stroke-width="2.2" stroke-linecap="round"/><rect x="612" y="272" width="316" height="50" rx="8" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><text x="626" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">f_regression</text><text x="626" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">Regresión F</text><circle cx="800" cy="298" r="14" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.5"/><path d="M795 293 l10 10 M805 293 l-10 10" stroke="#98A0A9" stroke-width="2.2" stroke-linecap="round"/><circle cx="888" cy="298" r="14" fill="#CFEFDB" stroke="#1E7A4A" stroke-width="1.5"/><path d="M882 298 l4 4 l8 -9" fill="none" stroke="#1E7A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="612" y="328" width="316" height="50" rx="8" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><text x="626" y="346" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">r_regression</text><text x="626" y="364" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">Pearson r</text><circle cx="800" cy="354" r="14" fill="#F2F4F6" stroke="#D8DEE4" stroke-width="1.5"/><path d="M795 349 l10 10 M805 349 l-10 10" stroke="#98A0A9" stroke-width="2.2" stroke-linecap="round"/><circle cx="888" cy="354" r="14" fill="#CFEFDB" stroke="#1E7A4A" stroke-width="1.5"/><path d="M882 354 l4 4 l8 -9" fill="none" stroke="#1E7A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="624" y="428.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">El widget detecta el tipo de objetivo y solo</text><text x="624" y="446.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#24292F" text-anchor="start" dominant-baseline="central">activa las funciones válidas.</text><text x="624" y="473.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A5313" text-anchor="start" dominant-baseline="central">r_regression no calcula p-valores: solo vale</text><text x="624" y="492.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A5313" text-anchor="start" dominant-baseline="central">con K mejores y Percentil.</text></svg>
