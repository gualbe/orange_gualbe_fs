<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Cómo funciona el widget Filtro Univariante</title><rect x="0.5" y="0.5" width="959" height="539" rx="16" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1"/><rect x="20" y="20" width="560" height="500" rx="12" fill="#FAFBFC" stroke="#D8DEE4" stroke-width="1"/><rect x="600" y="20" width="340" height="500" rx="12" fill="#FAFBFC" stroke="#D8DEE4" stroke-width="1"/><text x="44" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#24292F" text-anchor="start" dominant-baseline="central">1 · Cada atributo recibe una puntuación</text><text x="44" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">Ejemplo con el conjunto housing y la función Regresión F</text><text x="44" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start" dominant-baseline="central">puntuación</text><line x1="40" y1="260" x2="560" y2="260" stroke="#D8DEE4" stroke-width="1.5"/><rect x="76.0" y="110.0" width="52" height="150.0" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><text x="102.0" y="273" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="middle" dominant-baseline="central">LSTAT</text><rect x="142.0" y="142.3555376589834" width="52" height="117.64446234101659" rx="3" fill="#E3EEFB" stroke="#1F5F9E" stroke-width="1.2"/><text x="168.0" y="273" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="middle" dominant-baseline="central">RM</text><rect x="208.0" y="216.34133776162594" width="52" height="43.658662238