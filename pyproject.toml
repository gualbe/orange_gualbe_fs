[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orange_gualbe_fs"
version = "0.1.5"
description = "Add-on de seleccion de atributos (feature selection) para Orange Data Mining"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Gualberto Asencio Cortés", email = "gualbe@gmail.com"},
]
keywords = ["orange3 add-on", "feature selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "Orange3>=3.32.0",
    "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/gualbe/orange_gualbe_fs"
Repository = "https://github.com/gualbe/orange_gualbe_fs"
Issues = "https://github.com/gualbe/orange_gualbe_fs/issues"

[project.entry-points."orange3.addon"]
orange_gualbe_fs = "orangecontrib.orange_gualbe_fs"

[project.entry-points."orange.widgets"]
"Selección de Atributos" = "orangecontrib.orange_gualbe_fs.widgets"

[project.entry-points."orange.canvas.help"]
intersphinx = "orangecontrib.orange_gualbe_fs.widgets:WIDGET_HELP_PATH"

[tool.setuptools.packages.find]
include = ["orangecontrib*"]
namespaces = true

[tool.setuptools.package-data]
"orangecontrib.orange_gualbe_fs.widgets" = ["icons/*.svg"]
"orangecontrib.orange_gualbe_fs" = ["_help/html/**/*"]
